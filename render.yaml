# =====================================================================
# 天玑 · 售后看板  ——  Render Blueprint（一键部署）
# 用法：把这个仓库连到 Render，它会读这个文件自动建服务。
#
# ⚠️ 免费层说明（务必读 deploy/render/README.md）：
#   - 15 分钟无访问会休眠，唤醒需 30~60 秒
#   - 磁盘不持久：重启/重新部署后 data.js 之外的运行数据（快照、会话、
#     生成结果）会丢失
#   - 想持久化需升级 Starter（$7/月起）并挂载 Disk
# =====================================================================
services:
  - type: web
    name: tianji-bi
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: AI_BASE_URL
        value: https://apihub.agnes-ai.com/v1
      # 下面几项是密钥：sync:false 表示"部署时在 Render 面板里手填"，不写进仓库
      - key: AI_API_KEY
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: DRIVE_FOLDER
        value: MgWffMXFzlJWn4dDtVIcEdSpn2b
      - key: FEISHU_SHARE_HOST
        value: iihcw7mp26x.feishu.cn
      - key: BI_COOKIE_SECURE
        value: "1"
      - key: BI_ALLOWED_ORIGIN
        value: ""

    # ⬇️ 想持久化（必须升级 Starter 计划，$7/月起）时：
    #    1) 取消下面注释，挂一块磁盘；
    #    2) 还要把应用的运行数据目录指到磁盘（改代码里的 BASE 子目录），
    #       这一步我可以帮你改——否则磁盘挂上了、程序还是写在临时盘上。
    # disk:
    #   name: tianji-data
    #   mountPath: /var/tianji-data
    #   sizeGB: 1
